<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Complicidad en Pareja</title>
<meta name="theme-color" content="#120e1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; min-height:100%; width:100%;
    color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  body{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
  }
  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.8rem; letter-spacing:.35em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:14px;
  }
  h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.9rem; margin:0 0 34px; text-align:center;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card{
    width:100%; max-width:380px;
    display:flex; align-items:center; gap:16px;
    padding:20px; margin-bottom:14px;
    background: var(--card); border:1px solid var(--card-border);
    border-radius:16px; text-decoration:none; color:var(--fg);
    transition: transform .15s ease, border-color .2s ease;
  }
  .card:active{ transform: scale(.97); border-color: var(--teal); }
  button.card{ font-family:inherit; text-align:left; cursor:pointer; }
  .card .icon{ font-size:2rem; }
  .card .label{ flex:1; }
  .card .title{ font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:1.1rem; }
  .card .subtitle{ font-size:.85rem; color: var(--fg-muted); margin-top:2px; }
  .card .chevron{ font-size:1.4rem; color: var(--fg-muted); }
  .menu-btn{
    position:absolute; top:max(18px, env(safe-area-inset-top)); right:18px;
    font-size:1.6rem; line-height:1;
    color: var(--fg-muted); text-decoration:none;
    padding:8px 10px; border-radius:12px;
  }
  .menu-btn:active{ color: var(--fg); background: var(--card); }

  .modal{
    display:none; position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,.6);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal .caja{
    width:100%; max-width:380px; margin:0; text-align:center;
    background: var(--card); border:1px solid var(--teal);
    border-radius:18px; padding:22px 20px;
  }
  .modal h3{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.15rem; margin:0 0 8px;
  }
  .modal p{ font-size:.82rem; color:var(--fg-muted); margin:0 0 14px; }
  #qrCaja{
    background:#fff; padding:12px; border-radius:14px;
    display:flex; justify-content:center; margin:0 auto 14px; width:fit-content;
  }
  .btnQRcerrar{
    width:100%; padding:14px; background:none; border:none; cursor:pointer;
    color:var(--fg-muted); font-size:.9rem; text-decoration:underline;
  }
</style>
</head>
<body>

<a class="menu-btn" href="Citas/accesorios.html" aria-label="Configurar accesorios">☰</a>

<div class="eyebrow">Complicidad en Pareja</div>
<h1>¿Qué quieres hacer?</h1>

<a class="card" href="Citas/">
  <span class="icon">📅</span>
  <span class="label">
    <div class="title">Citas</div>
    <div class="subtitle">Agenda, confirma y revisa actividades</div>
  </span>
  <span class="chevron">›</span>
</a>

<a class="card" href="Retos/">
  <span class="icon">🏆</span>
  <span class="label">
    <div class="title">Retos</div>
    <div class="subtitle">Propón retos, gana puntos y cobra recompensas</div>
  </span>
  <span class="chevron">›</span>
</a>

<button class="card" id="btnQR" type="button">
  <span class="icon">📱</span>
  <span class="label">
    <div class="title">Cambiar a Citas de Pareja</div>
    <div class="subtitle">Muestra tu código para copiar tu base</div>
  </span>
  <span class="chevron">›</span>
</button>

<div class="modal" id="modalQR">
  <div class="caja">
    <h3>Código QR</h3>
    <p>Muéstralo en Citas de Pareja con «Tengo QR de mi pareja».</p>
    <div id="qrCaja"></div>
    <button class="btnQRcerrar" id="btnQRNo" type="button">Cerrar</button>
  </div>
</div>

<script>

// ====== CONFIGURACIÓN DE FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyD-9rwshPcK9PalXaX7-hJ8ArFP4yDst3w",
  authDomain: "planificacion-fbc96.firebaseapp.com",
  projectId: "planificacion-fbc96",
  storageBucket: "planificacion-fbc96.firebasestorage.app",
  messagingSenderId: "961759866700",
  appId: "1:961759866700:web:f4c28c3389c9fae4a529e9"
};

// ====== TELEGRAM ======
const TELEGRAM_BOT_TOKEN = "8994983675:AAH0ZGCJrYjlO0XeGuRg61lu1e91gi6FlE0";
const TELEGRAM_CHAT_ID = "-5323340491";

// El mismo formato que Citas de Pareja ya sabe leer: solo la config, tal cual.
const payloadQR = JSON.stringify({
  firebase: firebaseConfig,
  telegram: { token: TELEGRAM_BOT_TOKEN, chat: TELEGRAM_CHAT_ID }
});

const modalQR = document.getElementById("modalQR");
const qrCaja = document.getElementById("qrCaja");
const qrTexto = modalQR.querySelector("p");
const QR_PISTA = qrTexto.textContent;

document.getElementById("btnQR").onclick = ()=>{
  qrCaja.innerHTML = "";
  if(typeof QRCode === "undefined"){
    qrCaja.style.display = "none";
    qrTexto.textContent = "No se pudo cargar el generador de QR. Revisa tu conexión.";
  }else{
    qrCaja.style.display = "flex";
    qrTexto.textContent = QR_PISTA;
    new QRCode(qrCaja, {
      text: payloadQR,
      width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M
    });
  }
  modalQR.style.display = "flex";
};

document.getElementById("btnQRNo").onclick = ()=>{ modalQR.style.display = "none"; };
modalQR.onclick = e=>{ if(e.target === modalQR) modalQR.style.display = "none"; };

</script>

</body>
</html>
